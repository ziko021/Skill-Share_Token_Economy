[project]
name = "skill-share-token-economy"
version = "1.0.0"
description = "A decentralized skill-sharing platform using time-based tokens"
authors = ["Your Name <your.email@example.com>"]
keywords = ["stacks", "clarity", "skill-sharing", "time-tokens", "defi"]
license = "MIT"

[contracts.skill-share]
path = "contracts/skill-share.clar"
depends_on = []

[repl]
costs_version = 2
parser_version = 2

[repl.analysis]
passes = ["check_checker"]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

# Network configurations
[networks]
simnet = "http://localhost:20443"
testnet = "https://stacks-node-api.testnet.stacks.co"
mainnet = "https://stacks-node-api.mainnet.stacks.co"

# Development settings
[development]
deployment_fee_rate = 1
include_boot_contracts = true

# Test settings
[test]
timeout = 30000